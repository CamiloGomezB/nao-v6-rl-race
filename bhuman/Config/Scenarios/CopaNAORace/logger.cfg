// Repo NAO: logger de la Carrera Individual (Copa NAO CCM MX 2026), agregado el 2026-10-16 (E65).
// Sin este archivo, CopaNAORace tomaba el de Scenarios/Default, que loguea BallPercept en Upper y Lower; aqui
// BallPercept es una representacion por defecto (no hay detector de pelota) y bhuman abortaba al arrancar:
//   Error: Logger: Thread Upper should not log default representation BallPercept -> sigABRT
// Regla: solo representaciones que este escenario PROVEE en ese hilo (threads.cfg), nunca las de
// defaultRepresentations (BallPercept, RawBallPatch, BallSpots, ...). Sin imagenes (JPEGImage): pesan mucho.
// Lo que se guarda sirve para comparar el robot real con la simulacion (motores, IMU, pies, vision de carril y
// marcha RL). Formato y parametros como Scenarios/Default/logger.cfg.

// 2026-10-16: encendido otra vez. El sigSEGV al pasar a "waiting" no era el Logger sino la estrategia de futbol
// (E69, arreglado en CopaRaceController.cpp); con el Logger apagado fallaba igual.
// Is logging enabled?
enabled = true;

// The directory that will contain the log file.
path = "/home/nao/logging";

// The number of buffers allocated.
numOfBuffers = 12000;

// The size of each buffer in bytes.
sizeOfBuffer = 200000;

// The scheduling priority of the writer thread.
writePriority = -2;

// Logging will stop if less MB are available to the target device.
minFreeDriveSpace = 100;

// Representations to log per thread
representationsPerThread = [
  {
    thread = Lower;
    representations = [
      FrameInfo,
      CameraInfo,
      CameraMatrix,
      LanePercept,
    ];
  }, {
    thread = Cognition;
    representations = [
      FrameInfo,
      CopaRaceState,
      CopaRaceDecision,
      MotionRequest,
      EnhancedKeyStates,
    ];
  }, {
    thread = Motion;
    representations = [
      FrameInfo,
      CopaRLWalkStatus,
      JointRequest,
      JointSensorData,
      InertialData,
      InertialSensorData,
      FsrSensorData,
      FsrData,
      SystemSensorData,
      FallDownState,
      GroundContactState,
      MotionInfo,
      OdometryData,
      KeyStates,
    ];
  }
];
